[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-neurobank"
version = "1.0.0"
description = "A Django-based registry for the neurobank system"
readme = "README.rst"
requires-python = ">=3.11"
license = {text = "BSD 3-Clause License"}
authors = [
    {name = "C Daniel Meliza", email = "dan@meliza.org"},
]
maintainers = [
    {name = "C Daniel Meliza", email = "dan@meliza.org"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dependencies = [
    "django>=5.2,<6.2",
    "djangorestframework>=3.18.2,<4",
    "djangorestframework-link-header-pagination>=0.1.1,<0.2",
    "django-filter>=25.1,<27",
    "django-sendfile2>=0.7,<1",
    "basehash>=3.0.10,<4",
]

[project.urls]
Homepage = "https://github.com/melizalab/django-neurobank"
Changelog = "https://github.com/melizalab/django-neurobank/blob/master/CHANGELOG.rst"

[dependency-groups]
dev = [
    "pytest-cov>=5.0.0",
    "pytest>=8.3.3,<10",
    "pytest-django>=4.9.0",
    "pytest-dotenv>=0.5.2",
    "django-stubs>=5.2",
    "ruff>=0.7.0",
]
postgres = [
    "psycopg[binary]>=3.1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "nbank_registry.tests.settings"
django_find_project = false
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --no-migrations --cov=nbank_registry --cov-report=term-missing"
testpaths = ["nbank_registry/tests"]
env_files = [".env", ".test.env", "deploy.env"]

[tool.black]
line-length = 88
target-version = ["py311"]
include = '\.pyi?$'

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["build", "attic"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "PGH", # pygrep-hooks
    "RUF", # Ruff-specific
    "UP",  # pyupgrade
]
ignore = ["E221", "E501", "E701", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.hatch.build]
include = ["nbank_registry/**"]
exclude = ["*test*"]
artifacts = ["README.rst"]

[tool.hatch.build.targets.sdist]
include = ["nbank_registry/**", "CHANGELOG.rst"]

[tool.ty.environment]
python = ".venv"