name: Test app
on:
  pull_request:
  push:
    branches:
      - master

jobs:
  lint:
    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        version: "latest"
    - name: Check code with ruff
      run: uv run --frozen ruff check .
    - name: Build package
      run: uv build
    - name: Check that the README renders on PyPI
      run: uvx twine check --strict dist/*

  test:
    runs-on: ubuntu-26.04

    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        django-version: ["5.2", "6.1"]
        exclude:
          - python-version: "3.11"
            django-version: "6.1"

    steps:
    - uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        version: "latest"
        python-version: ${{ matrix.python-version }}
    - name: Start PostgreSQL
      # the runner image has PostgreSQL installed, with the service disabled;
      # using it avoids pulling a container image, which registries limit for
      # anonymous pulls from shared runner addresses
      run: |
        sudo systemctl start postgresql.service
        pg_isready --timeout=30
        sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"
        sudo -u postgres createdb test_db
        psql --version
    - name: Install dependencies
      env:
        DJANGO_VERSION: ${{ matrix.django-version }}
      run: |
        uv sync --frozen --group postgres
        # uv add would fail to resolve django 6.1 for python 3.11, so override in the environment
        uv pip install "Django~=${DJANGO_VERSION}"
    - name: Run tests on python ${{ matrix.python-version }}
      env:
        NBANK_TEST_DB: postgres
      run: uv run --no-sync pytest
    - name: Run tests with animals keyed by UUID
      env:
        NBANK_TEST_DB: postgres
        NBANK_TEST_ANIMAL_MODEL: uuid
      run: uv run --no-sync pytest
